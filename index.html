<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelMaster</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #2a2a2a;
      --panel-2: #363636;
      --border: #111;
      --accent: #3b82f6;
      --danger: #b93b3b;
      --fg: #dddddd;
      --muted: #9a9a9a;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    button { cursor: pointer; font-family: inherit; }
    #app, .pm-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }

    /* ── Header ─────────────────────────────────────────── */
    .pm-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex: 0 0 auto;
    }
    .pm-title { font-size: 14px; font-weight: 600; }
    .pm-header-spacer { flex: 1 1 auto; }

    /* ── Canvas ─────────────────────────────────────────── */
    .pm-canvas-wrap {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      background: #111;
    }
    .pm-canvas {
      flex: 1 1 auto;
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      touch-action: none;
    }

    /* ── Color strip (always visible palette) ──────────── */
    .pm-color-strip {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      overflow-x: auto;
    }
    .pm-color-swatch {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      border: 2px solid var(--border);
      border-radius: 4px;
      padding: 0;
      position: relative;
    }
    .pm-color-swatch::after {
      position: absolute;
      bottom: 1px;
      right: 2px;
      font-size: 9px;
      color: #fff;
      text-shadow: 0 0 2px #000;
    }
    .pm-color-swatch.fg::after { content: 'FG'; }
    .pm-color-swatch.bg::after { content: 'BG'; }
    .pm-color-sep {
      width: 1px;
      height: 30px;
      background: var(--border);
      flex: 0 0 auto;
    }
    .pm-color-cells {
      display: flex;
      gap: 3px;
      flex: 1 1 auto;
    }
    .pm-color-cell {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 0;
    }

    /* ── Bottom bar (tools + popup triggers) ───────────── */
    .pm-bottom-bar {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 4px;
      background: var(--panel);
      border-top: 1px solid var(--border);
    }
    .pm-toolbar {
      display: flex;
      flex-direction: row;
      gap: 2px;
      overflow-x: auto;
    }
    .pm-toolbar-extras {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    /* ── Status bar ─────────────────────────────────────── */
    .pm-status-bar {
      padding: 4px 10px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-family: monospace;
      font-size: 12px;
      color: var(--muted);
      flex: 0 0 auto;
    }

    /* ── Icon button ────────────────────────────────────── */
    .pm-icon-btn {
      min-width: 36px;
      height: 36px;
      padding: 0 8px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--fg);
      font-size: 16px;
      flex: 0 0 auto;
    }
    .pm-icon-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .pm-toolbar button {
      min-width: 36px;
      height: 36px;
      font-size: 16px;
      background: var(--panel-2);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 4px;
      flex: 0 0 auto;
    }
    .pm-toolbar button.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* ── Popover (bottom sheet) ─────────────────────────── */
    .pm-popover-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 900;
      padding: 12px;
    }
    .pm-popover-card {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 10px 10px 6px 6px;
      width: 100%;
      max-width: 420px;
      max-height: 78dvh;
      display: flex;
      flex-direction: column;
    }
    .pm-popover-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .pm-popover-title {
      flex: 1 1 auto;
      margin: 0;
      font-size: 14px;
      font-weight: 600;
    }
    .pm-popover-close {
      width: 28px;
      height: 28px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--fg);
    }
    .pm-popover-content {
      padding: 10px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 4px;
    }
    .panel-header > span { flex: 1 1 auto; }

    /* ── Palette ────────────────────────────────────────── */
    .swatches {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .swatch {
      width: 42px;
      height: 42px;
      border: 1px solid var(--border);
      border-radius: 4px;
      position: relative;
    }
    .swatch.fg::after, .swatch.bg::after {
      position: absolute;
      bottom: 2px;
      right: 4px;
      font-size: 10px;
      color: #fff;
      text-shadow: 0 0 2px #000;
    }
    .swatch.fg::after { content: 'FG'; }
    .swatch.bg::after { content: 'BG'; }
    .hex-input {
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 5px 6px;
      font-family: monospace;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 3px;
    }
    .palette-cell {
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      cursor: pointer;
      min-height: 24px;
    }

    /* ── Layers ─────────────────────────────────────────── */
    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
      max-height: 280px;
      overflow-y: auto;
    }
    .layer-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 6px;
      background: var(--bg);
      border-radius: 3px;
      cursor: pointer;
    }
    .layer-row.active { outline: 1px solid var(--accent); }
    .layer-visibility {
      width: 26px;
      height: 26px;
      font-size: 13px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
    }
    .layer-name { flex: 1 1 auto; font-size: 13px; }
    .layer-opacity { width: 80px; }

    /* ── Size select ────────────────────────────────────── */
    .size-select {
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 6px 8px;
      font-size: 14px;
    }

    /* ── Export ─────────────────────────────────────────── */
    .export-buttons {
      display: flex;
      gap: 4px;
    }
    .export-buttons button {
      flex: 1 1 0;
      padding: 6px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 3px;
    }

    /* ── Confirmation modal ─────────────────────────────── */
    .pm-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .pm-modal-card {
      background: var(--panel-2);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
      max-width: 360px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .pm-modal-title { margin: 0 0 8px 0; font-size: 15px; }
    .pm-modal-message {
      margin: 0 0 14px 0;
      font-size: 13px;
      line-height: 1.5;
      color: #bbb;
    }
    .pm-modal-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }
    .pm-modal-button {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      font-size: 13px;
      background: var(--panel);
      color: var(--fg);
    }
    .pm-modal-button-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .pm-modal-button-danger {
      background: var(--danger);
      border-color: #862828;
      color: white;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
