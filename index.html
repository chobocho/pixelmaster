<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelMaster</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #2a2a2a;
      --panel-2: #363636;
      --border: #111;
      --accent: #3b82f6;
      --fg: #dddddd;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #app, .pm-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
      /* 모바일 주소창 높이 변동을 반영 (지원 브라우저 한정). */
      height: 100dvh;
    }
    .pm-header {
      padding: 6px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
    }
    .pm-main {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }
    .pm-toolbar {
      width: 44px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 4px;
    }
    .pm-toolbar button {
      width: 36px;
      height: 36px;
      font-size: 18px;
      background: var(--panel-2);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
    }
    .pm-toolbar button.active {
      background: var(--accent);
      color: white;
    }
    .pm-canvas-wrap {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: stretch;
      background: #111;
    }
    .pm-canvas {
      flex: 1 1 auto;
      display: block;
      image-rendering: pixelated;
      touch-action: none;
    }
    .pm-right-panel {
      width: 240px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 10px;
      overflow-y: auto;
    }
    .pm-right-panel section {
      background: var(--panel-2);
      border-radius: 4px;
      padding: 8px;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .panel-header > span { flex: 1 1 auto; }
    .swatches {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .swatch {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .swatch.fg::after { content: 'FG'; color: #fff; text-shadow: 0 0 2px #000; }
    .swatch.bg::after { content: 'BG'; color: #fff; text-shadow: 0 0 2px #000; }
    .hex-input {
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 6px;
      font-family: monospace;
      box-sizing: border-box;
      margin-bottom: 6px;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
    }
    .palette-cell {
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 180px;
      overflow-y: auto;
    }
    .layer-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: var(--bg);
      border-radius: 3px;
      cursor: pointer;
    }
    .layer-row.active {
      outline: 1px solid var(--accent);
    }
    .layer-visibility {
      width: 22px;
      height: 22px;
      font-size: 13px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
    }
    .layer-name { flex: 1 1 auto; font-size: 12px; }
    .layer-opacity { width: 70px; }
    .export-buttons {
      display: flex;
      gap: 4px;
    }
    .export-buttons button {
      flex: 1 1 0;
      padding: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 3px;
      cursor: pointer;
    }
    .pm-status-bar {
      padding: 4px 12px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-family: monospace;
      font-size: 12px;
    }
    button { cursor: pointer; }

    /* 좁은 화면 (폴드 접힌 상태, 좁은 태블릿 모드 등) 대응.
       원칙: 본문 스크롤 없음, 뷰포트 안에 모든 UI 가 항상 보여야 한다.
       - 툴바: 상단 가로 한 줄 (넘치면 툴바 내부만 가로 스크롤)
       - 캔버스: 남는 공간 전부 (flex 1 1 auto)
       - 우측 패널: 하단으로 이동, max-height 제한 + 내부 스크롤 */
    @media (max-width: 800px) {
      html, body { overflow: hidden; }
      #app, .pm-root {
        height: 100dvh;
      }
      .pm-main {
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
      }
      .pm-toolbar {
        width: 100%;
        flex: 0 0 auto;
        flex-direction: row;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 2px;
        padding: 4px;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }
      .pm-toolbar button {
        width: 34px;
        height: 34px;
        font-size: 16px;
        flex: 0 0 auto;
      }
      .pm-canvas-wrap {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
      }
      .pm-right-panel {
        width: 100%;
        flex: 0 0 auto;
        max-height: 45dvh;
        border-left: none;
        border-top: 1px solid var(--border);
        overflow-y: auto;
      }
      .palette-grid {
        grid-template-columns: repeat(16, 1fr);
      }
      .layer-list {
        max-height: 120px;
      }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
