<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelMaster</title>
  <style>
    :root {
      --bg: #1e1e1e;
      --panel: #2a2a2a;
      --panel-2: #363636;
      --border: #111;
      --accent: #3b82f6;
      --fg: #dddddd;
    }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #app, .pm-root {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .pm-header {
      padding: 6px 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      font-size: 14px;
      font-weight: 600;
    }
    .pm-main {
      flex: 1 1 auto;
      display: flex;
      min-height: 0;
    }
    .pm-toolbar {
      width: 44px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 4px;
    }
    .pm-toolbar button {
      width: 36px;
      height: 36px;
      font-size: 18px;
      background: var(--panel-2);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 4px;
      cursor: pointer;
    }
    .pm-toolbar button.active {
      background: var(--accent);
      color: white;
    }
    .pm-canvas-wrap {
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: stretch;
      background: #111;
    }
    .pm-canvas {
      flex: 1 1 auto;
      display: block;
      image-rendering: pixelated;
      touch-action: none;
    }
    .pm-right-panel {
      width: 240px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 8px;
      gap: 10px;
      overflow-y: auto;
    }
    .pm-right-panel section {
      background: var(--panel-2);
      border-radius: 4px;
      padding: 8px;
    }
    .panel-header {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .panel-header > span { flex: 1 1 auto; }
    .swatches {
      display: flex;
      gap: 6px;
      margin-bottom: 6px;
    }
    .swatch {
      width: 40px;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    .swatch.fg::after { content: 'FG'; color: #fff; text-shadow: 0 0 2px #000; }
    .swatch.bg::after { content: 'BG'; color: #fff; text-shadow: 0 0 2px #000; }
    .hex-input {
      width: 100%;
      background: var(--bg);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 3px;
      padding: 3px 6px;
      font-family: monospace;
      box-sizing: border-box;
      margin-bottom: 6px;
    }
    .palette-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 2px;
    }
    .palette-cell {
      aspect-ratio: 1 / 1;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 180px;
      overflow-y: auto;
    }
    .layer-row {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: var(--bg);
      border-radius: 3px;
      cursor: pointer;
    }
    .layer-row.active {
      outline: 1px solid var(--accent);
    }
    .layer-visibility {
      width: 22px;
      height: 22px;
      font-size: 13px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--fg);
      cursor: pointer;
    }
    .layer-name { flex: 1 1 auto; font-size: 12px; }
    .layer-opacity { width: 70px; }
    .export-buttons {
      display: flex;
      gap: 4px;
    }
    .export-buttons button {
      flex: 1 1 0;
      padding: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--fg);
      border-radius: 3px;
      cursor: pointer;
    }
    .pm-status-bar {
      padding: 4px 12px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-family: monospace;
      font-size: 12px;
    }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./dist/main.js"></script>
</body>
</html>
